<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--card:#111122;--bdr:#1e1e3a;--rare:#4fa8d8;--epic:#c840ff;--leg:#ffd700;--txt:#e8e8f0;--mute:#666688;--green:#5cc06a;--red:#ff6b6b}

@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.preview-bar{padding:12px}}
</style>

function addLighting(scene,accentHex){var d1=new THREE.DirectionalLight(0xffffff,0.8);d1.position.set(3,5,4);scene.add(d1);var d2=new THREE.DirectionalLight(0x4488cc,0.3);d2.position.set(-3,2,-2);scene.add(d2);scene.add(new THREE.AmbientLight(0x333344,0.6));if(accentHex){var pl=new THREE.PointLight(accentHex,0.5,8);pl.position.set(0,2,2);scene.add(pl)}}
// Single shared renderer for ALL card thumbnails - renders once, captures as image, zero persistent contexts
function renderAllThumbnails(items,ITEM_MK){
  if(!items||!items.length)return;
  var W=260,H=260;
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setSize(W,H);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setClearColor(0,0);
  var scene=new THREE.Scene();var camera=new THREE.PerspectiveCamera(35,1,0.1,50);
  camera.position.set(0,1.5,5.5);camera.lookAt(0,0.8,0);
  addLighting(scene,null);
  items.forEach(function(item){
    var el=document.getElementById('c-'+item.slug);
    if(!el)return;
    var mkFn=ITEM_MK[item.slug];
    // Fallback: workshop-forged items aren't in ITEM_MK. Build a renderer on
    // the fly from item.config so every forged skin/eye/head/trail/glow shows.
    if(!mkFn&&item.config)mkFn=buildMkFnFromConfig(item.category,item.config);
    if(!mkFn)return;
    try{
      var blob=mkFn();
      // Particles are reserved for epic+ rarity. Strip any particle meshes
      // and cosmic ring from lower-rarity skin thumbnails.
      if(item.category==='skin'&&item.rarity!=='epic'&&item.rarity!=='legendary'){
        if(blob._particles&&blob._particles.length){
          blob._particles.forEach(function(p){blob.remove(p);if(p.geometry)p.geometry.dispose();if(p.material)p.material.dispose()});
          blob._particles=[];
        }
        if(blob._cosmicRing){blob.remove(blob._cosmicRing);if(blob._cosmicRing.geometry)blob._cosmicRing.geometry.dispose();if(blob._cosmicRing.material)blob._cosmicRing.material.dispose();blob._cosmicRing=null}
      }
      var extras=[]; // extra meshes to clean up after render
      // Remove old accent lights
      scene.children.forEach(function(c){if(c.isPointLight)scene.remove(c)});
      if(item.rarity==='legendary'){var pl=new THREE.PointLight(0xffd700,0.5,8);pl.position.set(0,2,2);scene.add(pl)}
      else if(item.rarity==='epic'){var pl2=new THREE.PointLight(0xaa00ff,0.4,8);pl2.position.set(0,2,2);scene.add(pl2)}

      // === TRAIL ITEMS: show blob moving with trail behind it ===
      if(blob._trailType){
        camera.position.set(0,2.5,8);camera.lookAt(0,0.6,0);
        blob.position.set(1.2,0,0);blob.rotation.y=Math.PI*0.8;
        var tType=blob._trailType;
        for(var ti=0;ti<10;ti++){
          var age=ti/10;
          var tx=1.2-age*2.8, tz=Math.sin(age*1.5)*0.6;
          var mat;
          if(tType==='smoke'){mat=cM(0x888899,null,0,{transparent:true,opacity:0.35*(1-age)});var tp=new THREE.Mesh(new THREE.SphereGeometry(0.12+age*0.2,6,6),mat);tp.position.set(tx,0.5,tz);scene.add(tp);extras.push(tp)}
          else if(tType==='sparkle'){var sc=[0xffffff,0xffffaa,0xaaffff][ti%3];mat=cM(sc,sc,0.5,{transparent:true,opacity:0.6*(1-age)});var sp=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.1),mat);sp.position.set(tx,0.4+Math.random()*0.4,tz);scene.add(sp);extras.push(sp)}
          else if(tType==='neon'){mat=cM(0xff00ff,0xff00aa,0.7,{transparent:true,opacity:0.6*(1-age)});var np=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.12),mat);np.position.set(tx,0.5,tz);scene.add(np);extras.push(np)}
          else if(tType==='shadow'){mat=cM(0x6622aa,null,0,{transparent:true,opacity:0.15*(1-age)});var shp=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),mat);shp.position.set(tx,0.5,tz);scene.add(shp);extras.push(shp)}
          else if(tType==='rainbow'){var rc=new THREE.Color();rc.setHSL((ti*36%360)/360,1,0.55);mat=new THREE.MeshPhongMaterial({color:rc,flatShading:true,transparent:true,opacity:0.6*(1-age)});mat.emissive=rc;mat.emissiveIntensity=0.4;var rp=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.12),mat);rp.position.set(tx,0.5,tz);scene.add(rp);extras.push(rp)}
        }
      }
      // === VICTORY ITEMS: show blob with effect props ===
      else if(blob._vicType){
        camera.position.set(0,1.5,5.5);camera.lookAt(0,0.8,0);
        blob.rotation.y=0.3;
        var vt=blob._vicType;
        if(vt==='spin'){blob.rotation.y=Math.PI*1.5;blob.position.y=0.1}
        else if(vt==='stomp'){
          blob.position.y=0.8; // mid-jump
          var ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.06,6,20),cM(0xffd700,0xffaa00,0.5,{transparent:true,opacity:0.4}));ring.rotation.x=-Math.PI/2;ring.position.y=0.05;scene.add(ring);extras.push(ring);
        }
        else if(vt==='shockwave'){
          var sw1=new THREE.Mesh(new THREE.TorusGeometry(1.5,0.07,6,20),cM(0xff00ff,0xff00aa,0.7,{transparent:true,opacity:0.35}));sw1.rotation.x=-Math.PI/2;sw1.position.y=0.5;scene.add(sw1);extras.push(sw1);
          var sw2=new THREE.Mesh(new THREE.TorusGeometry(0.8,0.06,6,20),cM(0xff00ff,0xff00aa,0.7,{transparent:true,opacity:0.5}));sw2.rotation.x=-Math.PI/2;sw2.position.y=0.5;scene.add(sw2);extras.push(sw2);
        }
        else if(vt==='confetti'){
          var ccs=[0xff0044,0x00ff88,0x4488ff,0xffcc00,0xff00ff];
          for(var ci=0;ci<20;ci++){var cm=cM(ccs[ci%5],ccs[ci%5],0.4,{transparent:true,opacity:0.7});var cp=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.06,0.04),cm);cp.position.set((Math.random()-0.5)*2.5,0.5+Math.random()*2.5,(Math.random()-0.5)*1.5);cp.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);scene.add(cp);extras.push(cp)}
        }
        else if(vt==='ascend'){
          blob.position.y=0.8;
          var pil=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,5,8),cM(0xffffff,0xffd700,0.4,{transparent:true,opacity:0.1}));pil.position.y=3;scene.add(pil);extras.push(pil);
          for(var oi=0;oi<5;oi++){var orb=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),cM(0xffd700,0xffaa00,0.8,{transparent:true,opacity:0.6}));var oa=oi*Math.PI*2/5;orb.position.set(Math.cos(oa)*0.8,1.2+Math.sin(oa*0.7)*0.3,Math.sin(oa)*0.8);scene.add(orb);extras.push(orb)}
        }
      }
      // === DEFAULT: regular blob ===
      else{
        blob.rotation.y=0.4;
        camera.position.set(0,1.5,5.5);camera.lookAt(0,0.8,0);
      }

      scene.add(blob);
      renderer.render(scene,camera);
      var img=document.createElement('img');
      img.src=renderer.domElement.toDataURL('image/png');
      img.style.cssText='width:100%;height:100%;object-fit:contain;display:block';
      el.innerHTML='';el.appendChild(img);
      // Cleanup
      scene.remove(blob);
      extras.forEach(function(m){scene.remove(m)});
      // Reset camera for next item
      camera.position.set(0,1.5,5.5);camera.lookAt(0,0.8,0);
    }catch(e){console.error('[Store thumbnail]',item.slug,e.message,e.stack)}
  });
  renderer.dispose();renderer.forceContextLoss();
}

var _pvScene,_pvCamera,_pvRenderer,_pvBlob,_pvTime=0;
window._previewBlob=function(skinC,eyes,hw,ov){

    if(!_pvRenderer){
      _pvScene=new THREE.Scene();_pvCamera=new THREE.PerspectiveCamera(30,140/160,0.1,50);
      _pvCamera.position.set(0,1.4,6.5);_pvCamera.lookAt(0,0.8,0);

      _pvRenderer.setSize(140,160);_pvRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));_pvRenderer.setClearColor(0,0);
      wrap.innerHTML='';wrap.appendChild(_pvRenderer.domElement);

      function pvAnim(){
        requestAnimationFrame(pvAnim);_pvTime+=0.016;
        if(_pvBlob){
          // Default idle: gentle spin + bob. Overridden below for trail/vic types.
          var isTrail=!!_pvBlob._trailType;
          var isVic=!!_pvBlob._vicType;
          if(!isTrail){
            _pvBlob.rotation.y+=0.005;
            _pvBlob.position.y=Math.sin(_pvTime*1.5)*0.08;
          }
          // Animate legendary particles if present
          if(_pvBlob._particles){
            for(var pi=0;pi<_pvBlob._particles.length;pi++){
              var pp=_pvBlob._particles[pi];
              if(pp._spd!==undefined){
                pp._life+=0.016*pp._spd*0.3;

                pp.position.x=pp._bx+Math.sin(_pvTime*2+pp._off)*0.1;
                pp.position.y=0.3+pp._life*1.5;
                pp.position.z=pp._bz+Math.cos(_pvTime*2+pp._off)*0.1;
                pp.material.opacity=0.9*(1-pp._life);
              }else if(pp._gt!==undefined){
                pp._gt+=0.016*pp._gs;

              }else if(pp._oR!==undefined){
                var ang=pp._oO+_pvTime*pp._oS;
                pp.position.x=Math.cos(ang)*pp._oR;
                pp.position.y=0.85+pp._oT+Math.sin(_pvTime*2+pp._oO)*0.1;
                pp.position.z=Math.sin(ang)*pp._oR;
              }
              else if(pp._pType==='ice'){var ia=_pvTime*pp._iS+pp._iA;pp.position.x=Math.cos(ia)*pp._iR;pp.position.z=Math.sin(ia)*pp._iR;pp._iY=(pp._iY+0.0024)%1;pp.position.y=1.8-pp._iY*2;pp.rotation.z+=0.008}
              else if(pp._pType==='electric'){if(Math.random()<0.15){pp.position.x=(Math.random()-0.5)*1.6;pp.position.y=0.3+Math.random()*1.6;pp.position.z=(Math.random()-0.5)*0.8+0.4}pp.material.opacity=Math.random()>0.3?0.9:0.2}

// Builds a renderer function from a stored item config. Used as a fallback for
// workshop-forged items whose slug isn't in the hardcoded ITEM_MK dict.
function buildMkFnFromConfig(cat,rawConfig){
  var c=typeof rawConfig==='string'?JSON.parse(rawConfig):rawConfig;
  return function(){
    function ph(v){if(v==null)return undefined;if(typeof v==='number')return v;return parseInt(String(v).replace(/^0x/,'').replace(/^#/,''),16)}
    var ov={};
    if(cat==='skin'){
      var sc=ph(c.skinColor||c.hex)||0xff8866;
      if(c.emissive)ov.em=ph(c.emissive);
      if(c.emissiveI!=null)ov.emI=c.emissiveI;
      if(c.eyeGlow)ov.eyeGlow=ph(c.eyeGlow);
      if(c.animType)ov.animType=c.animType;
      if(c.wireframe){ov.wireframe=true;if(c.wireColor)ov.wireColor=ph(c.wireColor)}
      if(c.transparent){ov.transparent=true;ov.opacity=c.opacity||0.82}
      if(c.metallic)ov.metallic=true;
      if(c.neonGlow)ov.neonGlow=true;
      var hwC=c.crownColor||c.hornColor||c.spikeColor||c.hwColor;
      if(hwC)ov.hwColor=ph(hwC);
      if(c.crownColor)ov.crownColor=ph(c.crownColor);
      if(c.hornColor)ov.hornColor=ph(c.hornColor);
      if(c.spikeColor)ov.spikeColor=ph(c.spikeColor);
      if(c.blushColor)ov.blushColor=ph(c.blushColor);
      if(c.antennaColor)ov.antennaColor=ph(c.antennaColor);
      return mkBlob(sc,c.eyes||'X',c.head||'Horns',false,ov);
    }
    if(cat==='skin_color'){
      if(c.emissive)ov.em=ph(c.emissive);
      return mkBlob(ph(c.hex)||0xff8866,'X','Horns',false,ov);
    }
    if(cat==='eye_style'){
      if(c.color)ov.eyeGlow=ph(c.color);
      return mkBlob(0xff8866,c.style||c.type||'X','Spike',false,ov);
    }
    if(cat==='headwear'){
      if(c.color)ov.hwColor=ph(c.color);
      return mkBlob(0xff8866,'Dots',c.type||c.style||'Crown',false,ov);
    }
    if(cat==='trail_effect'){
      ov.trailType=c.type;
      ov.trailColor=ph(c.color)||0xffd54f;
      return mkBlob(0xff8866,'Dots','Spike',false,ov);
    }
    if(cat==='glow_color'){
      ov.glowColor=ph(c.hex)||0x8a5acc;
      ov.glowIntensity=c.intensity||0.3;
      return mkBlob(0xff8866,'X','Horns',false,ov);
    }
    if(cat==='victory_anim'){
      return mkBlob(0xff8866,'X','Crown',false,{});
    }
    return mkBlob(0xff8866,'X','Horns',false,{});
  };
}

'skin-coral':function(){return mkBlob(0xff8866,'X','Horns',false,{})},'skin-lime':function(){return mkBlob(0xaadd55,'X','Horns',false,{})},'skin-grape':function(){return mkBlob(0xaa88dd,'X','Horns',false,{})},'skin-steel':function(){return mkBlob(0x88bbcc,'X','Horns',false,{})},'skin-gold':function(){return mkBlob(0xddcc55,'X','Horns',false,{})}
};
var VIC_TYPES={vic_spin:'spin',vic_stomp:'stomp',vic_shockwave:'shockwave',vic_confetti:'confetti',vic_ascend:'ascend'};
// Thumbnails use shared renderer - no MAX_CARD_SCENES needed
</script>
<script>
(function(){
var API=location.origin,session=new URLSearchParams(location.search).get('session')||localStorage.getItem('hh_session');
if(session)localStorage.setItem('hh_session',session);
var catalog=[],inventory=new Set(),loadout={},loadoutConfigs={};
var CAT_REVERSE={skins:['skin','skin_color'],eyes:['eye_style'],headwear:['headwear'],trails:['trail_effect'],victory:['victory_anim']};
var CATS=['skins','eyes','headwear','trails','victory'],LABELS={skins:'SKINS',eyes:'EYES',headwear:'HEADWEAR',trails:'TRAILS',victory:'VICTORY'},currentCat='skins';
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
var nav=document.getElementById('nav');
CATS.forEach(function(cat,i){var btn=document.createElement('div');btn.className='cat-btn'+(i===0?' active':'');btn.dataset.cat=cat;btn.id='cat-btn-'+cat;btn.textContent=LABELS[cat];btn.onclick=function(){switchCat(cat)};nav.appendChild(btn)});
function updateTabCounts(){
  var totalAll=0,ownedAll=0;
  CATS.forEach(function(cat){
    var dbCat=CAT_REVERSE[cat];
    var total=catalog.filter(function(it){return dbCat.indexOf(it.category)!==-1}).length;
    var owned=catalog.filter(function(it){return dbCat.indexOf(it.category)!==-1&&(inventory.has(it.slug)||it.is_default)}).length;
    totalAll+=total;ownedAll+=owned;
    var btn=document.getElementById('cat-btn-'+cat);
    if(btn)btn.textContent=LABELS[cat]+' '+owned+'/'+total;
  });
  var pct=totalAll>0?Math.round(ownedAll/totalAll*100):0;
  var ct=document.getElementById('coll-text');if(ct)ct.textContent='COLLECTION: '+ownedAll+'/'+totalAll;
  var cp=document.getElementById('coll-pct');if(cp)cp.textContent=pct+'%';
  var cf=document.getElementById('coll-fill');if(cf)cf.style.width=pct+'%';
}
function switchCat(cat){currentCat=cat;document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('active',b.dataset.cat===cat)});document.querySelectorAll('.section').forEach(function(s){s.classList.toggle('active',s.id==='sec-'+cat)});var dbCat=CAT_REVERSE[cat];var items=catalog.filter(function(it){return dbCat.indexOf(it.category)!==-1});setTimeout(function(){renderAllThumbnails(items,ITEM_MK)},50)}
async function init(){await fetchBalance();await fetchCatalog();if(session){await fetchInventory();await fetchLoadout()}buildSections();updateTabCounts();switchCat('skins')}
async function fetchBalance(){if(!session)return;try{var r=await fetch(API+'/api/store/balance',{headers:{'x-session':session}});var d=await r.json();document.getElementById('bal').textContent='\u25CF '+(d.balance||0).toLocaleString()}catch(e){}}
async function fetchCatalog(){try{var r=await fetch(API+'/api/store/catalog');var d=await r.json();catalog=d.items||[];console.log('[Store] Catalog:',catalog.length,'items')}catch(e){catalog=[]}}
async function fetchInventory(){try{var r=await fetch(API+'/api/store/inventory',{headers:{'x-session':session}});var d=await r.json();inventory=new Set((d.items||[]).map(function(i){return i.slug}))}catch(e){}}
async function fetchLoadout(){try{var r=await fetch(API+'/api/store/loadout',{headers:{'x-session':session}});var d=await r.json();loadout={};loadoutConfigs={};if(d.loadout){['skin','skin_color','eye_style','headwear','trail_effect','glow_color','name_color','victory_anim','badge'].forEach(function(cat){if(d.loadout[cat+'_slug'])loadout[cat]=d.loadout[cat+'_slug'];if(d.loadout[cat+'_config']){var cfg=d.loadout[cat+'_config'];loadoutConfigs[cat]=typeof cfg==='string'?JSON.parse(cfg):cfg}});loadoutConfigs._skinRarity=(d.loadout.skin_rarity||'').toLowerCase()}updateMainPreview()}catch(e){}}
function updateMainPreview(){
  var skinC=0xff8866,eyes='X',hw='Horns',ov={};
  // Full skin overrides everything
  var sk=loadoutConfigs.skin;
  if(sk){
    skinC=parseInt(String(sk.skinColor||'0xff8866').replace('0x',''),16);
    eyes=sk.eyes||'X';hw=sk.head||'Horns';
    if(sk.emissive)ov.em=parseInt(String(sk.emissive).replace('0x',''),16);
    if(sk.emissiveI)ov.emI=sk.emissiveI;
    if(sk.wireframe){ov.wireframe=true;ov.wireColor=parseInt(String(sk.wireColor||'0x00ffcc').replace('0x',''),16)}
    if(sk.transparent){ov.transparent=true;ov.opacity=sk.opacity||0.82}
    if(sk.blushColor)ov.blushColor=parseInt(String(sk.blushColor).replace('0x',''),16);
    if(sk.crownColor)ov.crownColor=parseInt(String(sk.crownColor).replace('0x',''),16);
    if(sk.hornColor)ov.hornColor=parseInt(String(sk.hornColor).replace('0x',''),16);
    if(sk.spikeColor)ov.spikeColor=parseInt(String(sk.spikeColor).replace('0x',''),16);
    if(sk.antennaColor)ov.antennaColor=parseInt(String(sk.antennaColor).replace('0x',''),16);
    if(sk.neonGlow)ov.neonGlow=true;if(sk.metallic)ov.metallic=true;
    if(sk.eyeGlow||sk.emissive)ov.eyeGlow=parseInt(String(sk.eyeGlow||sk.emissive||'0').replace('0x',''),16)||0;
    if(sk.animType&&(loadoutConfigs._skinRarity==='epic'||loadoutConfigs._skinRarity==='legendary'))ov.animType=sk.animType;
  }else{
    // Individual skin color
    var sc=loadoutConfigs.skin_color;
    if(sc&&sc.hex)skinC=parseInt(String(sc.hex).replace('0x',''),16)||0xff8866;
  }
  // Individual eye override
  var ec=loadoutConfigs.eye_style;
  if(ec&&ec.style&&!sk)eyes=ec.style;
  // Individual headwear override
  var hc=loadoutConfigs.headwear;
  if(hc&&(hc.style||hc.type)&&!sk){hw=hc.type||hc.style;if(hc.color)ov.hornColor=parseInt(String(hc.color).replace('0x',''),16)}
  window._previewBlob(skinC,eyes,hw,ov);
  var info=document.getElementById('preview-equipped');if(!info)return;var lines=[];
  if(loadout.skin)lines.push('SKIN: '+loadout.skin.replace('skin_','').toUpperCase());
  else if(loadout.skin_color)lines.push('COLOR: '+loadout.skin_color.replace('skin-','').toUpperCase());
  if(loadout.eye_style)lines.push('EYES: '+loadout.eye_style.replace(/^(eyes[-_])/,'').toUpperCase());
  if(loadout.headwear)lines.push('HEAD: '+loadout.headwear.replace(/^(head[-_]|hw_)/,'').toUpperCase());
  if(loadout.trail_effect)lines.push('TRAIL: '+loadout.trail_effect.replace(/^trail[-_]/,'').toUpperCase());
  if(loadout.victory_anim)lines.push('VICTORY: '+loadout.victory_anim.replace(/^vic_/,'').toUpperCase());
  info.innerHTML=lines.length?lines.join('<br>'):'<span style="color:var(--mute)">DEFAULT LOADOUT</span>'}
function buildSections(){var content=document.getElementById('content');content.innerHTML='';
CATS.forEach(function(cat,i){var dbCat=CAT_REVERSE[cat];var items=catalog.filter(function(it){return dbCat.indexOf(it.category)!==-1});var sec=document.createElement('div');sec.className='section'+(i===0?' active':'');sec.id='sec-'+cat;var html='';
['legendary','epic','rare','common'].forEach(function(tier){var ti=items.filter(function(it){return it.rarity===tier});if(!ti.length)return;
html+='<div class="tier-lbl '+tier+'">'+tier.toUpperCase()+'</div><div class="grid">';
ti.forEach(function(item){var owned=inventory.has(item.slug)||item.is_default;var isLocked=item.locked;var traits=item.traits?(typeof item.traits==='string'?JSON.parse(item.traits):item.traits):[];
var btnHtml='';if(isLocked){btnHtml='<div class="card-footer"><span class="iprice" style="color:var(--mute)"><span class="coin">H</span>'+item.price_credits.toLocaleString()+'</span><span class="btn-locked">COMING SOON</span></div>'}else if(owned){btnHtml='<div class="card-footer"><span class="price-free">'+(item.is_default?'FREE':'OWNED')+'</span></div>'}else{btnHtml='<div class="card-footer"><span class="iprice"><span class="coin">H</span>'+item.price_credits.toLocaleString()+'</span><button class="btn-act btn-buy" data-slug="'+item.slug+'" data-action="buy">BUY</button></div>'}
var traitsHtml=traits.length?'<div class="traits">'+traits.map(function(t){return'<span class="trait">'+t+'</span>'}).join('')+'</div>':'';
html+='<div class="card'+(isLocked?' locked':'')+'" data-t="'+tier+'" data-preview="'+item.slug+'"><div class="cvs" id="c-'+item.slug+'"></div><div class="info"><div class="tbadge '+tier+'">'+tier.toUpperCase()+'</div><div class="iname">'+item.name+'</div><div class="idesc">'+(item.description||'')+'</div>'+traitsHtml+'</div>'+btnHtml+'</div>'});html+='</div>'});
if(!html)html='<div style="text-align:center;color:var(--mute);padding:40px">NO ITEMS</div>';sec.innerHTML=html;content.appendChild(sec)});
// Single event listener (only added once, not per rebuild)
if(!content._storeListenerAdded){content._storeListenerAdded=true;
content.addEventListener('click',async function(e){
  // Click-to-preview: click anywhere on card
  var card=e.target.closest('[data-preview]');
  if(card&&!e.target.closest('[data-action]')){
    var slug=card.dataset.preview;
    var mkFn=ITEM_MK[slug];
    // Fallback for workshop-forged items: build renderer from config
    if(!mkFn){
      var clickItem=catalog.find(function(it){return it.slug===slug});
      if(clickItem&&clickItem.config)mkFn=buildMkFnFromConfig(clickItem.category,clickItem.config);
    }
    if(mkFn){
      var blob=mkFn();var sc2=blob._skinMat?blob._skinMat.color.getHex():0xff8866;
      var ey='X',hw2='Horns';
      // Read from mkFn blob what eyes/hw it has by slug pattern
      window._previewBlob(sc2,ey,hw2);
      // Better: just use the mkFn directly to update preview scene
      if(_pvBlob){
        // Clean up any lingering trail/vic FX from the previous blob
        if(_pvBlob._trailBuf){_pvBlob._trailBuf.forEach(function(p){_pvScene.remove(p);p.geometry.dispose();p.material.dispose()});_pvBlob._trailBuf=null}
        if(_pvBlob._cfBuf){_pvBlob._cfBuf.forEach(function(p){_pvScene.remove(p);p.geometry.dispose();p.material.dispose()});_pvBlob._cfBuf=null}
        if(_pvBlob._sw){_pvScene.remove(_pvBlob._sw);_pvBlob._sw.geometry.dispose();_pvBlob._sw.material.dispose();_pvBlob._sw=null}
        _pvScene.remove(_pvBlob);
      }
      _pvBlob=mkFn();_pvScene.add(_pvBlob);
      var item=catalog.find(function(it){return it.slug===slug});
      if(item){var info=document.getElementById('preview-equipped');if(info)info.innerHTML='PREVIEWING: '+item.name}
    }
    return;
  }
  // Buy action
  var btn=e.target.closest('[data-action]');if(!btn)return;
  var action=btn.dataset.action,slug2=btn.dataset.slug;
  if(!session){toast('CONNECT X TO BUY');return}
  if(action==='buy'){try{var r=await fetch(API+'/api/store/purchase',{method:'POST',headers:{'Content-Type':'application/json','x-session':session},body:JSON.stringify({slug:slug2})});var d=await r.json();if(d.ok){toast('PURCHASED!');inventory.add(slug2);await fetchBalance();rebuildAndSwitch()}else{toast(d.error||'PURCHASE FAILED')}}catch(e2){toast('ERROR')}}
})}}function rebuildAndSwitch(){buildSections();updateTabCounts();switchCat(currentCat)}
init()})();
</script>
</body>
</html>
