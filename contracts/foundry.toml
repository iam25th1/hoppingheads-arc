# Arc Foundry workspace (circlefin/arc-foundry, binaries installed as arc-forge, arc-cast,
# arc-anvil). Upstream forge compiles this too; only the Arc network family needs the fork.
[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
# No timestamps in this code base, no randomness, no selfdestruct: nothing for the
# Arc differences to bite. Tests that need Arc's predeploys fork arc-anvil.
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
# Keys never live here. RPC URLs are public.
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[fmt]
line_length = 120
